# ==============================================================================
# GITHUB ACTIONS WORKFLOW: FRONTEND CI/CD (ISOLATED PATH DEPLOYMENT)
# ==============================================================================
# SEPARATION OF DEPLOYMENT:
# This workflow is strictly isolated to frontend changes. It triggers ONLY when
# code changes occur within `frontend/**` or this workflow file.
# Backend code changes in `backend/**` or `amplify/**` will NOT trigger this pipeline.
# ==============================================================================

name: Frontend Quality Gate & Web Deployment

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      # FRONTEND PATH FILTERING: Only run when frontend files change
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'

jobs:
  quality-gate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Map Git Branch to Environment Stage & Amplify Branch Name
        id: stage
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "STAGE=prod" >> $GITHUB_OUTPUT
            echo "AMPLIFY_BRANCH=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "STAGE=staging" >> $GITHUB_OUTPUT
            echo "AMPLIFY_BRANCH=staging" >> $GITHUB_OUTPUT
          else
            # develop branch maps directly to develop stage and develop branch on Amplify
            echo "STAGE=develop" >> $GITHUB_OUTPUT
            echo "AMPLIFY_BRANCH=develop" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # STEP 1: Frontend Quality Gate (Install, Lint, Build)
      # ------------------------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend Code
        working-directory: frontend
        run: npm run lint

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Fetch Environment SSM Parameters for Frontend Build
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          echo "Fetching SSM Parameters for Stage: [${STAGE}]..."

          # Safe SSM Parameter Fetch Helper (Redirect Stderr to /dev/null to prevent GITHUB_ENV pollution)
          get_param() {
            aws ssm get-parameter --name "$1" --query "Parameter.Value" --output text 2>/dev/null || echo ""
          }

          FETCHED_API_URL=$(get_param "/awstraining/${STAGE}/VITE_API_ENDPOINT")
          FETCHED_REGION=$(get_param "/awstraining/${STAGE}/VITE_AWS_REGION")
          FETCHED_USER_POOL_ID=$(get_param "/awstraining/${STAGE}/VITE_USER_POOL_ID")
          FETCHED_USER_POOL_CLIENT_ID=$(get_param "/awstraining/${STAGE}/VITE_USER_POOL_CLIENT_ID")

          # Validate and set VITE_API_ENDPOINT
          if [[ "$FETCHED_API_URL" =~ ^http ]]; then
            echo "VITE_API_ENDPOINT=$FETCHED_API_URL" >> $GITHUB_ENV
            echo " - VITE_API_ENDPOINT set from SSM: $FETCHED_API_URL"
          fi

          # Validate and set VITE_USER_POOL_ID
          if [[ "$FETCHED_USER_POOL_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "VITE_USER_POOL_ID=$FETCHED_USER_POOL_ID" >> $GITHUB_ENV
            echo " - VITE_USER_POOL_ID set from SSM: $FETCHED_USER_POOL_ID"
          fi

          # Validate and set VITE_USER_POOL_CLIENT_ID
          if [[ "$FETCHED_USER_POOL_CLIENT_ID" =~ ^[a-zA-Z0-9]+$ ]]; then
            echo "VITE_USER_POOL_CLIENT_ID=$FETCHED_USER_POOL_CLIENT_ID" >> $GITHUB_ENV
            echo " - VITE_USER_POOL_CLIENT_ID set from SSM: $FETCHED_USER_POOL_CLIENT_ID"
          fi

          # Safe fallback for VITE_AWS_REGION
          if [[ "$FETCHED_REGION" =~ ^[a-z0-9-]+$ ]]; then
            echo "VITE_AWS_REGION=$FETCHED_REGION" >> $GITHUB_ENV
          else
            echo "VITE_AWS_REGION=${{ secrets.AWS_REGION || 'ap-southeast-2' }}" >> $GITHUB_ENV
          fi

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      # ------------------------------------------------------------------------
      # STEP 2: Deploy Built Frontend Bundle directly to AWS Amplify Hosting
      # ------------------------------------------------------------------------
      - name: Deploy Frontend Pre-built Bundle to AWS Amplify Hosting
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
          TARGET_BRANCH: ${{ steps.stage.outputs.AMPLIFY_BRANCH }}
          AWS_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        run: |
          echo "================================================================="
          echo "FRONTEND DEPLOYMENT: Stage [${STAGE}], Target Amplify Branch [${TARGET_BRANCH}]"
          echo "================================================================="
          if [ -n "$AWS_APP_ID" ]; then
            cd frontend/dist
            zip -r ../../deploy.zip .
            cd ../..

            echo "Ensuring branch '$TARGET_BRANCH' exists in AWS Amplify Console App ID: $AWS_APP_ID..."
            aws amplify create-branch --app-id "$AWS_APP_ID" --branch-name "$TARGET_BRANCH" 2>/dev/null || true

            echo "Creating deployment for App ID: $AWS_APP_ID, Branch: $TARGET_BRANCH..."
            DEPLOYMENT_RESPONSE=$(aws amplify create-deployment --app-id "$AWS_APP_ID" --branch-name "$TARGET_BRANCH")
            ZIP_URL=$(echo "$DEPLOYMENT_RESPONSE" | jq -r '.zipUploadUrl')
            JOB_ID=$(echo "$DEPLOYMENT_RESPONSE" | jq -r '.jobId')

            echo "Uploading deploy.zip package to AWS Amplify Hosting..."
            curl -H "Content-Type: application/zip" --upload-file deploy.zip "$ZIP_URL"

            echo "Triggering AWS Amplify Start-Deployment Job ID: $JOB_ID..."
            aws amplify start-deployment --app-id "$AWS_APP_ID" --branch-name "$TARGET_BRANCH" --job-id "$JOB_ID"
            echo "Successfully deployed frontend bundle to AWS Amplify Hosting on branch [$TARGET_BRANCH]."
          else
            echo "AMPLIFY_APP_ID secret not set. Static assets compiled in frontend/dist successfully."
          fi
