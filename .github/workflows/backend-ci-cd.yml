name: Backend Quality Gate & AWS Deployment

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - 'backend/**'
      - 'amplify/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  quality-gate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Determine Environment Stage
        id: stage
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "STAGE=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "STAGE=staging" >> $GITHUB_OUTPUT
          else
            echo "STAGE=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint Code
        working-directory: backend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: backend
        run: npm run test

      - name: Build Lambda Functions
        working-directory: backend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Install Amplify CLI & Deploy CloudFormation Infrastructure
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          npm install -g @aws-amplify/cli
          AMPLIFY="{\"projectName\":\"awstraining\",\"envName\":\"${STAGE}\",\"defaultEditor\":\"none\"}"
          PROVIDERS="{\"awscloudformation\":{\"configLevel\":\"project\",\"useProfile\":false,\"accessKeyId\":\"${AWS_ACCESS_KEY_ID}\",\"secretAccessKey\":\"${AWS_SECRET_ACCESS_KEY}\",\"region\":\"${AWS_REGION}\"}}"
          amplify init --amplify "$AMPLIFY" --providers "$PROVIDERS" --yes
          amplify push --yes

      - name: Deploy Producer Lambda
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingProducer-${STAGE}"
          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/dist/producer.zip
            echo "Successfully updated $FUNCTION_NAME Lambda code."
          else
            echo "$FUNCTION_NAME function does not exist on AWS yet. Skipping live code update."
          fi

      - name: Deploy Consumer Lambda
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingConsumer-${STAGE}"
          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/dist/consumer.zip
            echo "Successfully updated $FUNCTION_NAME Lambda code."
          else
            echo "$FUNCTION_NAME function does not exist on AWS yet. Skipping live code update."
          fi
