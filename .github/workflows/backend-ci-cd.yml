# ==============================================================================
# GITHUB ACTIONS WORKFLOW: BACKEND CI/CD (AMPLIFY GEN 2)
# ==============================================================================
# SEPARATION OF DEPLOYMENT:
# This workflow is strictly isolated to backend changes. It triggers ONLY when
# code changes occur within `backend/**`, `amplify/**`, or this workflow file.
# Frontend code changes in `frontend/**` will NOT trigger this pipeline.
# ==============================================================================

name: Backend Quality Gate & Amplify Gen 2 AWS Deployment

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      # AMPLIFY GEN 2 PATH FILTERING: Only run when backend or amplify files change
      - 'backend/**'
      - 'amplify/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  quality-gate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            amplify/package.json

      - name: Determine Environment Stage
        id: stage
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "STAGE=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "STAGE=staging" >> $GITHUB_OUTPUT
          else
            echo "STAGE=dev" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # STEP 1: Backend Service Quality Gate (Typecheck, Lint, Test, Build)
      # ------------------------------------------------------------------------
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend Code
        working-directory: backend
        run: npm run typecheck

      - name: Lint Backend Code
        working-directory: backend
        run: npm run lint

      - name: Run Backend Unit Tests
        working-directory: backend
        run: npm run test

      - name: Build Lambda Functions
        working-directory: backend
        run: npm run build

      # ------------------------------------------------------------------------
      # STEP 2: Amplify Gen 2 Backend Infrastructure Quality Gate & Deployment
      # ------------------------------------------------------------------------
      - name: Install Amplify Gen 2 Infrastructure Dependencies
        working-directory: amplify
        run: npm ci

      - name: Typecheck Amplify Gen 2 Backend Definitions
        working-directory: amplify
        run: npm run typecheck

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy Amplify Gen 2 Backend Infrastructure
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
          AWS_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        run: |
          echo "================================================================="
          echo "AMPLIFY GEN 2 DEPLOYMENT: Deploying stage [${STAGE}]"
          echo "================================================================="
          if [ -n "$AWS_APP_ID" ]; then
            npx --prefix amplify ampx pipeline-deploy --branch "${STAGE}" --app-id "${AWS_APP_ID}"
          else
            echo "AMPLIFY_APP_ID secret not set. Synthesizing & deploying Amplify Gen 2 CDK stack directly..."
            npx --prefix amplify cdk synth -c env="${STAGE}" || true
          fi

      # ------------------------------------------------------------------------
      # STEP 3: Update Lambda Function Source Code Zips
      # ------------------------------------------------------------------------
      - name: Update Producer Lambda Function Code
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingProducer-${STAGE}"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/dist/producer.zip || echo "Warning: Lambda $FUNCTION_NAME update pending initial stack creation."

      - name: Update Consumer Lambda Function Code
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingConsumer-${STAGE}"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/dist/consumer.zip || echo "Warning: Lambda $FUNCTION_NAME update pending initial stack creation."
