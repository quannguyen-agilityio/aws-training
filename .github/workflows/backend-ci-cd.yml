name: Backend Quality Gate & AWS Deployment

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - 'backend/**'
      - 'amplify/**'
      - 'amplify.yml'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  quality-gate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Determine Environment Stage
        id: stage
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "STAGE=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "STAGE=staging" >> $GITHUB_OUTPUT
          else
            echo "STAGE=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint Code
        working-directory: backend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: backend
        run: npm run test

      - name: Build Lambda Functions
        working-directory: backend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy Storage & Messaging Infrastructure (DynamoDB, SQS, SNS)
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          aws cloudformation deploy \
            --template-file amplify/backend/custom/storageMessaging/storageMessaging-cloudformation-template.json \
            --stack-name "awstraining-storageMessaging-${STAGE}" \
            --parameter-overrides env="${STAGE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy IAM Execution Roles
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          aws cloudformation deploy \
            --template-file amplify/backend/custom/iam/iam-cloudformation-template.json \
            --stack-name "awstraining-iam-${STAGE}" \
            --parameter-overrides env="${STAGE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy Cognito Auth Infrastructure & Save SSM Parameters
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          aws cloudformation deploy \
            --template-file amplify/backend/auth/apexAuth/apexAuth-cloudformation-template.json \
            --stack-name "awstraining-auth-${STAGE}" \
            --parameter-overrides env="${STAGE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "awstraining-auth-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)

          APP_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name "awstraining-auth-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='AppClientID'].OutputValue" \
            --output text)

          aws ssm put-parameter --name "/awstraining/${STAGE}/VITE_USER_POOL_ID" --value "$USER_POOL_ID" --type "String" --overwrite
          aws ssm put-parameter --name "/awstraining/${STAGE}/VITE_USER_POOL_CLIENT_ID" --value "$APP_CLIENT_ID" --type "String" --overwrite
          aws ssm put-parameter --name "/awstraining/${STAGE}/VITE_AWS_REGION" --value "$AWS_REGION" --type "String" --overwrite

      - name: Deploy Producer & Consumer Lambda Stacks
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          aws cloudformation deploy \
            --template-file amplify/backend/function/producer/producer-cloudformation-template.json \
            --stack-name "awstraining-producer-${STAGE}" \
            --parameter-overrides env="${STAGE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          aws cloudformation deploy \
            --template-file amplify/backend/function/consumer/consumer-cloudformation-template.json \
            --stack-name "awstraining-consumer-${STAGE}" \
            --parameter-overrides env="${STAGE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy REST API Gateway Stack & Save Endpoint to SSM Parameter Store
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "awstraining-auth-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)

          aws cloudformation deploy \
            --template-file amplify/backend/api/apexApi/apexApi-cloudformation-template.json \
            --stack-name "awstraining-api-${STAGE}" \
            --parameter-overrides env="${STAGE}" authapexAuthUserPoolId="${USER_POOL_ID}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "awstraining-api-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='RootUrl'].OutputValue" \
            --output text)

          aws ssm put-parameter --name "/awstraining/${STAGE}/VITE_API_ENDPOINT" --value "$API_URL" --type "String" --overwrite

      - name: Update Producer Lambda Code
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingProducer-${STAGE}"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/dist/producer.zip

      - name: Update Consumer Lambda Code
        env:
          STAGE: ${{ steps.stage.outputs.STAGE }}
        run: |
          FUNCTION_NAME="PlayerOnboardingConsumer-${STAGE}"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/dist/consumer.zip
