version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - |
          STAGE="${AWS_BRANCH}"
          if [ "${AWS_BRANCH}" = "main" ]; then STAGE="prod"; fi
          if [ "${AWS_BRANCH}" = "develop" ]; then STAGE="dev"; fi

          echo "Fetching SSM Parameters for Stage: [${STAGE}]..."
          FETCHED_API_URL=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_API_ENDPOINT" --query "Parameter.Value" --output text 2>&1 || echo "")
          FETCHED_REGION=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_AWS_REGION" --query "Parameter.Value" --output text 2>&1 || echo "ap-southeast-2")
          FETCHED_USER_POOL_ID=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_USER_POOL_ID" --query "Parameter.Value" --output text 2>&1 || echo "")
          FETCHED_USER_POOL_CLIENT_ID=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_USER_POOL_CLIENT_ID" --query "Parameter.Value" --output text 2>&1 || echo "")

          case "$FETCHED_API_URL" in
            http*) export VITE_API_ENDPOINT="$FETCHED_API_URL" ;;
            *) echo "Warning: SSM API_URL fetch output: $FETCHED_API_URL" ;;
          esac

          case "$FETCHED_USER_POOL_ID" in
            *_) export VITE_USER_POOL_ID="$FETCHED_USER_POOL_ID" ;;
            *) echo "Warning: SSM USER_POOL_ID fetch output: $FETCHED_USER_POOL_ID" ;;
          esac

          if [ -n "$FETCHED_USER_POOL_CLIENT_ID" ] && [[ "$FETCHED_USER_POOL_CLIENT_ID" != *"An error occurred"* ]]; then
            export VITE_USER_POOL_CLIENT_ID="$FETCHED_USER_POOL_CLIENT_ID"
          fi

          echo "Final Environment Variables embedded by Vite:"
          echo " - VITE_API_ENDPOINT: ${VITE_API_ENDPOINT}"
          echo " - VITE_AWS_REGION: ${VITE_AWS_REGION}"
          echo " - VITE_USER_POOL_ID: ${VITE_USER_POOL_ID}"
          echo " - VITE_USER_POOL_CLIENT_ID: ${VITE_USER_POOL_CLIENT_ID}"

          npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
