version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - |
          STAGE="${AWS_BRANCH}"
          if [ "${AWS_BRANCH}" = "main" ]; then STAGE="prod"; fi
          if [ "${AWS_BRANCH}" = "develop" ]; then STAGE="dev"; fi

          FETCHED_API_URL=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_API_ENDPOINT" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          FETCHED_REGION=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_AWS_REGION" --query "Parameter.Value" --output text 2>/dev/null || echo "ap-southeast-2")
          FETCHED_USER_POOL_ID=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_USER_POOL_ID" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          FETCHED_USER_POOL_CLIENT_ID=$(aws ssm get-parameter --name "/awstraining/${STAGE}/VITE_USER_POOL_CLIENT_ID" --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -n "$FETCHED_API_URL" ]; then export VITE_API_ENDPOINT="$FETCHED_API_URL"; fi
          if [ -n "$FETCHED_REGION" ]; then export VITE_AWS_REGION="$FETCHED_REGION"; fi
          if [ -n "$FETCHED_USER_POOL_ID" ]; then export VITE_USER_POOL_ID="$FETCHED_USER_POOL_ID"; fi
          if [ -n "$FETCHED_USER_POOL_CLIENT_ID" ]; then export VITE_USER_POOL_CLIENT_ID="$FETCHED_USER_POOL_CLIENT_ID"; fi

          echo "Building Frontend for Stage [${STAGE}] with auto-injected SSM parameters:"
          echo " - VITE_API_ENDPOINT=${VITE_API_ENDPOINT}"
          echo " - VITE_AWS_REGION=${VITE_AWS_REGION}"
          echo " - VITE_USER_POOL_ID=${VITE_USER_POOL_ID}"
          echo " - VITE_USER_POOL_CLIENT_ID=${VITE_USER_POOL_CLIENT_ID}"

          npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
